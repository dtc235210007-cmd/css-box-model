<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS grid-gap</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8fafc;
            padding: 30px 20px;
            color: #1e293b;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #0f172a;
        }

        .example-card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 24px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .example-card h2 {
            font-size: 18px;
            color: #2563eb;
            margin-bottom: 6px;
        }

        .example-card p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 14px;
        }

        /* VÍ DỤ 1: Khoảng cách hàng và cột bằng nhau (20px) */
        .grid-container-1 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px; /* tương đương row-gap: 20px; column-gap: 20px; */
        }

        .grid-container-1 div {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            color: #0c4a6e;
            border-radius: 6px;
        }

        /* VÍ DỤ 2: Khoảng cách hàng và cột khác nhau (30px hàng, 10px cột) */
        .grid-container-2 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 30px 10px; /* row-gap: 30px; column-gap: 10px; */
        }

        .grid-container-2 div {
            background-color: lightgreen;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            color: #064e3b;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Thực Hành Thuộc Tính CSS grid-gap</h1>

    <!-- VÍ DỤ 1 -->
    <div class="example-card">
        <h2>Ví dụ 1: <code>grid-gap: 20px;</code></h2>
        <p>Khoảng cách giữa các hàng và các cột đều bằng 20px:</p>
        <div class="grid-container-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- VÍ DỤ 2 -->
    <div class="example-card">
        <h2>Ví dụ 2: <code>grid-gap: 30px 10px;</code></h2>
        <p>Khoảng cách hàng là 30px, khoảng cách cột là 10px:</p>
        <div class="grid-container-2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>

</body>
</html>
