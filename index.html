<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        
        <!-- Danh sách menu điều hướng -->
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>

        <!-- Biểu tượng hamburger menu cho mobile -->
        <div class="menu-icon">&#9776;</div>
    </nav>

    <!-- Khối nội dung minh họa trải nghiệm -->
    <div style="padding: 40px 20px; text-align: center; color: #334155;">
        <h2>Thực hành Responsive Navbar với Flexbox và JavaScript</h2>
        <p style="margin-top: 10px;">Thu nhỏ chiều rộng trình duyệt dưới 768px để kiểm tra menu hamburger.</p>
    </div>

</body>
</html>
