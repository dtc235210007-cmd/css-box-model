<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5 CSS qua CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f1f5f9;
        }
        .form-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="row justify-content-center">
            <!-- Căn chỉnh form ở giữa: col-md-8 trên tablet/pc, col-12 trên mobile -->
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="form-card p-4 p-md-5">
                    
                    <!-- TIÊU ĐỀ FORM -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Tạo Tài Khoản Mới</h2>
                        <p class="text-muted small">Điền thông tin chi tiết dưới đây để hoàn tất việc đăng ký</p>
                    </div>

                    <form action="#" method="POST">
                        
                        <!-- 1. HỌ VÀ TÊN -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
                        </div>

                        <!-- 2. EMAIL -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <div class="form-text text-muted">Chúng tôi cam kết bảo mật thông tin cá nhân của bạn.</div>
                        </div>

                        <!-- 3. MẬT KHẨU & 4. XÁC NHẬN MẬT KHẨU (Grid 2 cột) -->
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>
                        </div>

                        <!-- 5. GIỚI TÍNH (Radio button) -->
                        <div class="mb-3">
                            <label class="form-label d-block fw-semibold">Giới tính</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                <label class="form-check-label" for="genderMale">Nam</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                <label class="form-check-label" for="genderFemale">Nữ</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                <label class="form-check-label" for="genderOther">Khác</label>
                            </div>
                        </div>

                        <!-- 6. SỞ THÍCH (Checkbox) -->
                        <div class="mb-3">
                            <label class="form-label d-block fw-semibold">Sở thích</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding" checked>
                                <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                <label class="form-check-label" for="hobbySports">Thể thao</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                            </div>
                        </div>

                        <!-- 7. QUỐC GIA (Dropdown Select) -->
                        <div class="mb-4">
                            <label for="country" class="form-label fw-semibold">Quốc gia</label>
                            <select class="form-select" id="country" required>
                                <option value="" selected disabled>-- Chọn quốc gia của bạn --</option>
                                <option value="vn">Việt Nam</option>
                                <option value="us">Hoa Kỳ (United States)</option>
                                <option value="jp">Nhật Bản</option>
                                <option value="kr">Hàn Quốc</option>
                                <option value="sg">Singapore</option>
                            </select>
                        </div>

                        <!-- ĐIỀU KHOẢN -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label text-muted small" for="agreeTerms">
                                Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản sử dụng</a> và <a href="#" class="text-decoration-none">Chính sách quyền riêng tư</a>.
                            </label>
                        </div>

                        <!-- 8. NÚT SUBMIT -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">Đăng Ký Tài Khoản</button>
                        </div>

                        <!-- CHUYỂN HƯỚNG ĐĂNG NHẬP -->
                        <p class="text-center text-muted small mb-0">
                            Đã có tài khoản? <a href="#" class="text-decoration-none fw-semibold">Đăng nhập tại đây</a>
                        </p>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
