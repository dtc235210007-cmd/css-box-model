<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <!-- Liên kết file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 class="gallery-title">Bộ Sưu Tập Hình Ảnh (Responsive Image Gallery)</h2>
    <p class="gallery-desc">Thu nhỏ hoặc mở rộng trình duyệt để xem sự thay đổi số lượng ảnh trên một dòng.</p>

    <div class="gallery-container">
        <!-- Ảnh 1 -->
        <div class="responsive-col">
            <div class="gallery-card">
                <a target="_blank" href="https://picsum.photos/id/1018/800/600">
                    <img src="https://picsum.photos/id/1018/400/300" alt="Thiên nhiên hùng vĩ">
                </a>
                <div class="desc">Khung cảnh đồi núi kỳ vĩ buổi sớm mai</div>
            </div>
        </div>

        <!-- Ảnh 2 -->
        <div class="responsive-col">
            <div class="gallery-card">
                <a target="_blank" href="https://picsum.photos/id/1015/800/600">
                    <img src="https://picsum.photos/id/1015/400/300" alt="Dòng sông thơ mộng">
                </a>
                <div class="desc">Dòng sông uốn lượn qua những rặng cây xanh</div>
            </div>
        </div>

        <!-- Ảnh 3 -->
        <div class="responsive-col">
            <div class="gallery-card">
                <a target="_blank" href="https://picsum.photos/id/1019/800/600">
                    <img src="https://picsum.photos/id/1019/400/300" alt="Bờ biển hoàng hôn">
                </a>
                <div class="desc">Sóng biển vỗ về bờ cát lúc chiều hoàng hôn</div>
            </div>
        </div>

        <!-- Ảnh 4 -->
        <div class="responsive-col">
            <div class="gallery-card">
                <a target="_blank" href="https://picsum.photos/id/1025/800/600">
                    <img src="https://picsum.photos/id/1025/400/300" alt="Thế giới động vật">
                </a>
                <div class="desc">Chú cún ấm áp dễ thương trong tiết trời lạnh</div>
            </div>
        </div>
    </div>

    <!-- Clearfix giúp khung chứa không bị xẹp chiều cao -->
    <div class="clearfix"></div>

</body>
</html>
